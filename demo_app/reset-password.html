<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop - Reset password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="brand" href="./"><span class="brand-mark">D</span>Demo Shop</a>
  <main>
    <h1 data-testid="page-title">Choose a new password</h1>
    <form id="reset-form" data-testid="reset-form" novalidate>
      <label for="new-password">New password</label>
      <input id="new-password" name="new_password" type="password" autocomplete="new-password" data-testid="new-password">
      <p class="hint">At least 12 characters, with a letter, a digit and a symbol.</p>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" data-testid="confirm-password">
      <p id="reset-error" class="error" data-testid="reset-error" role="alert" hidden></p>
      <button type="submit" data-testid="reset-submit">Reset password</button>
    </form>
    <p id="reset-success" class="success" data-testid="reset-success" role="status" hidden>
      Your password has been reset. <a href="login.html" data-testid="link-login-after-reset">Log in</a>
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
