<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop - Forgot password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <label for="language">Language</label>
    <select id="language" name="language" data-testid="language-select">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </header>
  <a class="brand" href="./"><span class="brand-mark">D</span>Demo Shop</a>
  <main>
    <h1 data-testid="page-title">Forgot your password?</h1>
    <p data-testid="instructions">Enter your registered email address and we will send you a reset link.</p>
    <form id="forgot-form" data-testid="forgot-form" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" data-testid="email-input">
      <p id="email-error" class="error" data-testid="email-error" role="alert" hidden></p>
      <button type="submit" data-testid="send-reset-link">Send reset link</button>
    </form>
    <p id="confirmation" class="success" data-testid="confirmation" role="status" hidden></p>
    <a href="login.html" data-testid="link-back-to-login">Back to log in</a>
    <a href="outbox.html" data-testid="link-outbox">Open the demo inbox</a>
    <a href="https://docs.example.com/password-help" data-testid="external-help">Password help (external)</a>
  </main>
  <script src="app.js"></script>
</body>
</html>
